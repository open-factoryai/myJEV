# myJEV web container — main nginx config (runs as an unprivileged user on :8080)
user  nginx;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format myjev escape=json
        '{"ts":"$time_iso8601",'
        '"remote":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt_ms":"$request_time",'
        '"upstream":"$upstream_addr",'
        '"upstream_ms":"$upstream_response_time",'
        '"agent":"$http_user_agent",'
        '"request_id":"$request_id"}';

    access_log  /dev/stdout  myjev;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    server_tokens      off;
    types_hash_max_size 2048;
    client_max_body_size 8m;
    client_body_buffer_size 128k;

    # temp paths must be writable by the unprivileged user
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
