# ══════════════════════════════════════════════════════════════════════════
#  myJEV web server
#   • serves the built SPA (Vite → /usr/share/nginx/html)
#   • proxies /api/* to the api container
#
#  The API address is resolved at request time through Docker's embedded DNS
#  (127.0.0.11) so nginx boots even if the api container is still starting.
#  Override the target with the compose service alias `api` (default).
# ══════════════════════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # security headers (relaxed CSP would break nothing here; keep it permissive
    # but still block framing/clickjacking and force modern upgrade semantics)
    add_header X-Content-Type-Options "nosniff"                always;
    add_header X-Frame-Options        "SAMEORIGIN"             always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── health endpoints (for Docker HEALTHCHECK / load balancers) ─────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status on;
        access_log  off;
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────
    location /api/ {
        set $myjev_api api:3001;

        proxy_pass         http://$myjev_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # LLM / decider calls can be slow — keep the door open
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_buffering    off;
        proxy_request_buffering off;
        client_max_body_size 8m;
    }

    # ── immutable hashed assets ───────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
